   name: docker-hub
   on:
     push:
       branches: [main]
     workflow_dispatch:

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
           with:
             lfs: true

         - uses: docker/login-action@v3
           with:
             username: ${{ secrets.DOCKERHUB_USERNAME }}
             password: ${{ secrets.DOCKERHUB_TOKEN }}

         - uses: docker/build-push-action@v6
           with:
             context: .
             push: true
             tags: dwthoang/dsp302:latest